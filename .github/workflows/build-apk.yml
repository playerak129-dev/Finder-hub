
name: Build BHENX FINDER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java installation
        run: java -version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create debug.keystore at project root
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -noprompt

      - name: Verify debug.keystore exists
        run: ls -lh debug.keystore && file debug.keystore

      - name: Display Gradle configuration
        run: ./gradlew -version

      - name: Verify signing configuration
        run: |
          echo "=== Checking debug.keystore ==="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Build Debug APK with diagnostics
        run: ./gradlew :app:assembleDebug --stacktrace --info

      - name: Locate generated APK
        run: |
          echo "=== Searching for APK files ==="
          find . -name "*.apk" -type f
          echo ""
          echo "=== APK output directory ==="
          ls -lh app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK found yet"

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bhenx-finder-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build failure diagnostics
        if: failure()
        run: |
          echo "=== Build failed - Collecting diagnostics ==="
          echo ""
          echo "=== Gradle build directory contents ==="
          find app/build -type f -name "*.log" | head -10 | xargs -I {} sh -c 'echo "--- {} ---" && tail -50 {}'
          echo ""
          echo "=== Checking signing config ==="
          cat app/build.gradle* 2>/dev/null | grep -A 10 "signingConfigs" || echo "No signingConfigs found"